name: One-time full rebuild

# Run this ONCE, by hand, from the Actions tab. It re-reads every team-season in
# NBA/ABA history with the current parser — which is what pulls in games-played
# data and the cup-of-coffee players the roster tables leave out. Takes ~5 hours.
# After it finishes, the nightly workflow keeps everything current on its own.

on:
  workflow_dispatch:

permissions:
  contents: write

# never run at the same time as the nightly job — two jobs pushing to the same
# branch is what made the first attempt lose 4.5 hours of work at the last step
concurrency:
  group: ebk-data-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python3 ebk.py redo
      - run: python3 ebk.py offseason
        continue-on-error: true
      - run: python3 ebk.py numbers
        continue-on-error: true
      - run: python3 ebk.py master
      - run: python3 ebk.py verify

      - name: Publish the feed
        run: |
          cp ball-knowledge-MASTER.json ball-knowledge-db.json
          git config user.name "EBK crawler"
          git config user.email "eliteballknowledge15@gmail.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "data: full rebuild (games played + cup-of-coffee players)"
          # if anything else pushed while we were crawling, take our data and retry
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected — pulling and retrying ($i/5)"
            git pull --rebase -X ours origin main || git rebase --skip || true
            sleep 5
          done
          echo "could not push after 5 tries"
          exit 1
